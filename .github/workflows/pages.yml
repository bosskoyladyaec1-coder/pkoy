name: เผยแพร่เว็บ
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: เตรียมไฟล์เว็บ + ใส่เลขเวอร์ชันอัตโนมัติ
        run: |
          V=$(date -u +%Y%m%d%H%M)
          mkdir _site
          cp *.html *.js *.css _site/
          sed -i -E "s/\.(js|css)\?v=[0-9A-Za-z]+/.\1?v=$V/g" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
